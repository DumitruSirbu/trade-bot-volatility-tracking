# Same-origin reverse-proxy serving the dashboard SPA and forwarding the
# engine's REST + WebSocket surface (ADR 0026 §2.2, §2.5).
#
# Listens on 8080 so the unprivileged nginx user (uid 101) can bind without
# CAP_NET_BIND_SERVICE.

server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Trust the docker/compose-level proxy chain only — the dashboard never
    # parses an X-Forwarded-For from the browser; nginx always rewrites.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 127.0.0.1;

    # ----- Compression --------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # ----- Security headers (baseline; tightened in M11) ----------------
    add_header X-Content-Type-Options "nosniff"             always;
    add_header X-Frame-Options        "DENY"                always;
    add_header Referrer-Policy        "no-referrer"         always;
    # CSP: same-origin-only. Modern browsers treat ws/wss to the SPA origin as
    # `connect-src 'self'` — no wildcard scheme needed (R2 security M2).
    # 'unsafe-inline' kept for Vite-emitted style tags; tightened in M11.
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self'; \
         style-src 'self' 'unsafe-inline'; \
         img-src 'self' data:; \
         font-src 'self' data:; \
         connect-src 'self'; \
         object-src 'none'; \
         frame-src 'none'; \
         frame-ancestors 'none'; \
         base-uri 'self'; \
         form-action 'self'"
        always;

    # ----- Static assets -----------------------------------------------
    # Long-cache hashed bundles, no-cache HTML (ADR 0026 §2.5).
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # ----- REST passthrough --------------------------------------------
    location /v1/ {
        proxy_pass         http://engine:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # R2 security M1 — OVERWRITE, never append. `proxy_add_x_forwarded_for`
        # appends any client-supplied XFF to nginx's view, letting an attacker
        # inject a forged first hop. We stamp only nginx's $remote_addr so the
        # engine's first-hop reader (TRUST_PROXY_HOPS=1) sees the real client.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ----- WebSocket upgrade -------------------------------------------
    location /socket.io/ {
        proxy_pass         http://engine:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # R2 security M1 — OVERWRITE, never append. `proxy_add_x_forwarded_for`
        # appends any client-supplied XFF to nginx's view, letting an attacker
        # inject a forged first hop. We stamp only nginx's $remote_addr so the
        # engine's first-hop reader (TRUST_PROXY_HOPS=1) sees the real client.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Long-lived connections; socket.io's ping/pong keeps liveness.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ----- SPA fallback (LAST) -----------------------------------------
    # Anything not matched above resolves to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
