# Local + dev stack: postgres + engine + dashboard (+ adminer for DB inspection).
# All services share the default compose network so the dashboard's nginx can
# resolve `engine`, and the engine can resolve `postgres`.
# Credentials come from the root `.env` (see `.env.example`) — never inline here.

services:
    postgres:
        image: postgres:18.4-alpine
        container_name: trade-bot-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - '${DB_PORT}:5432'
        volumes:
            # Postgres 18+ images store data in a major-version subdir under this path.
            # Mount the parent (NOT /var/lib/postgresql/data) per docker-library/postgres#1259.
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    # R3 A — One-shot migration runner. Reuses the engine image, runs the
    # typeorm CLI against the compiled JS DataSource (dist/database/dataSource.js),
    # then exits. Engine waits for `service_completed_successfully` before booting,
    # so a fresh `docker compose up` always lands a schema-correct DB without the
    # operator remembering to run `pnpm migration:run` manually.
    # Stand-alone dev (`pnpm engine:dev` on the host) still uses the existing
    # CLI workflow — this service is the docker-compose path only.
    engine-migrator:
        build:
            context: .
            dockerfile: apps/engine/Dockerfile
            args:
                INCLUDE_DEV_LOGS: 'true'
        image: trade-bot-engine:local
        container_name: trade-bot-engine-migrator
        restart: 'no'
        init: true
        env_file:
            - .env
        environment:
            DB_HOST: postgres
            DB_PORT: '5432'
            DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
        depends_on:
            postgres:
                condition: service_healthy
        # Use Node's resolver to locate the typeorm CLI (pnpm hoists deps, so a
        # hard-coded path would be brittle across pnpm versions).
        command:
            - sh
            - -c
            - exec node "$$(node -p "require.resolve('typeorm/cli.js')")" -d dist/database/dataSource.js migration:run

    engine:
        build:
            context: .
            dockerfile: apps/engine/Dockerfile
            args:
                # Bake pino-pretty into the image for local dev (NODE_ENV=development
                # uses pretty logging). CI / prod must build with INCLUDE_DEV_LOGS=false
                # to keep the image reproducible and free of dev-only network fetches.
                INCLUDE_DEV_LOGS: 'true'
        image: trade-bot-engine:local
        container_name: trade-bot-engine
        restart: unless-stopped
        # `init: true` runs tini as PID 1 — proper SIGTERM/SIGINT delivery to node.
        init: true
        env_file:
            - .env
        environment:
            # Compose-only overrides — `environment:` wins over `env_file:`.
            # Inside the network postgres resolves by service name.
            DB_HOST: postgres
            DB_PORT: '5432'
            DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
            # Bind the engine to a known port regardless of host-side ENGINE_PORT.
            ENGINE_PORT: '3000'
        depends_on:
            postgres:
                condition: service_healthy
            engine-migrator:
                condition: service_completed_successfully
        ports:
            # Exposed on the host for direct curl/debug; the dashboard reaches
            # the engine over the compose network and never via this mapping.
            - '${ENGINE_PORT:-3000}:3000'
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/v1/health >/dev/null 2>&1 || exit 1']
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 30s

    dashboard:
        build:
            context: .
            dockerfile: apps/dashboard/Dockerfile
        image: trade-bot-dashboard:local
        container_name: trade-bot-dashboard
        restart: unless-stopped
        init: true
        depends_on:
            engine:
                condition: service_healthy
        ports:
            - '${DASHBOARD_PORT:-8080}:8080'
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1']
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    # M13 W1.B / live-smoke — MCP server (HTTP transport). ADR 0033 / 0034 /
    # 0038. Long-running read-only JSON-RPC surface that the agent reaches
    # over the compose network via service-DNS (`http://bot-mcp:5434/jsonrpc`).
    #
    # Port is INTERNAL ONLY (no `ports:` mapping). The compose private network
    # is the protection boundary — host loopback is not. The HTTP transport
    # therefore binds 0.0.0.0 inside the container (`MCP_HTTP_BIND_HOST`
    # combined with `MCP_HTTP_ALLOW_NETWORK_BIND=1` opts-in past the default
    # ADR 0038 §2.1 loopback assertion; the assertion still holds for every
    # non-compose call site).
    #
    # Opt-in via the `agent` profile so a plain `docker compose up` of the
    # engine never launches it.
    bot-mcp:
        profiles: [agent]
        build:
            context: .
            dockerfile: apps/mcp/Dockerfile
        image: trade-bot-mcp:local
        container_name: trade-bot-mcp
        restart: unless-stopped
        init: true
        # ADR 0033 / 0036 least-privilege: enumerate every env var explicitly so
        # adding a new engine secret to .env never silently widens MCP's surface.
        # MCP reads under the dedicated `mcp_reader` role (ADR 0034) — NEVER
        # the engine writer role.
        environment:
            MCP_TRANSPORT: http
            MCP_HTTP_PORT: '5434'
            # Compose-network bind: the listener must accept connections from
            # peer containers (bot-agent) which arrive over a non-loopback
            # interface inside this container's net namespace. The opt-in flag
            # is mandatory — without it the transport refuses to start.
            MCP_HTTP_BIND_HOST: 0.0.0.0
            MCP_HTTP_ALLOW_NETWORK_BIND: '1'
            # Inside the network postgres resolves by service name on its
            # in-container port 5432.
            MCP_DB_HOST: postgres
            MCP_DB_PORT: '5432'
            MCP_DB_USER: ${MCP_DB_USER:-mcp_reader}
            MCP_DB_PASSWORD: ${MCP_DB_PASSWORD}
            MCP_DB_NAME: ${MCP_DB_NAME:-${DB_NAME}}
            MCP_DB_SSL: ${MCP_DB_SSL:-}
            MCP_ENGINE_CMD: ${MCP_ENGINE_CMD:-}
            MCP_BOUNDARY_GUARD: ${MCP_BOUNDARY_GUARD:-}
            # Bearer-token verification master secret. MCP derives the HS256
            # verification key via HKDF-Expand(master, 'auth v1', 32B) —
            # matching the engine's DerivedKeyService — so engine-minted
            # bearers verify cleanly here.
            AUTH_HMAC_SECRET: ${AUTH_HMAC_SECRET}
            NODE_ENV: ${NODE_ENV:-production}
            LOG_LEVEL: ${LOG_LEVEL:-info}
            GIT_SHA: ${GIT_SHA:-}
        depends_on:
            postgres:
                condition: service_healthy
        # NOTE: no `ports:` block. The MCP transport is INTERNAL to the compose
        # network. Operators that need host access must use `docker compose
        # exec bot-mcp wget -qO- http://127.0.0.1:5434/healthz`.
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5434/healthz >/dev/null 2>&1 || exit 1']
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 15s

    # M13 W0.5 / W5.B — agent batch job. ADR 0035 (structural boundary): the
    # agent is a separate workspace app that reaches MCP as a network client
    # only and writes drafts via the agent_writer SDF. Opt-in via the `agent`
    # profile so `docker compose up` of the engine never launches it.
    #
    # W5.B note: bot-agent itself is a one-shot batch job (`node dist/main.js`),
    # but ofelia (the cron sidecar below) triggers it via `docker exec`, which
    # requires the container to be running. We therefore PID1 `sleep infinity`
    # here and let ofelia exec the agent process weekly. The lockfile inside
    # main.ts (proper-lockfile @ /tmp/bot-agent.lock) makes overlapping execs
    # safe — a contention exits 0 with `LOCK_HELD`.
    #
    # To run on-demand:
    #   docker compose --profile agent up -d
    #   docker compose --profile agent exec bot-agent node dist/main.js \
    #       --week-iso 2026-W22 --parent-version-id <N> --dry-run
    bot-agent:
        profiles: [agent]
        build:
            context: .
            dockerfile: apps/agent/Dockerfile
        image: trade-bot-agent:local
        container_name: trade-bot-agent
        # Long-lived idle container so ofelia can `docker exec` into it.
        # The actual batch job is launched by ofelia (see bot-agent-cron).
        restart: unless-stopped
        init: true
        command: ['sleep', 'infinity']
        # M13 W6 fix wave 4 (#2): ADR 0035 least-privilege. NEVER inject `.env`
        # wholesale — the agent's process env must NOT contain BINANCE_*,
        # AUTH_*, TELEGRAM_*, or any other engine-only secret. Each var is
        # explicitly listed so adding a new engine secret to .env does not
        # silently widen the agent's surface.
        environment:
            # Inside the network postgres resolves by service name. The agent
            # connects under the dedicated `agent_writer` role (ADR 0036), not
            # the engine's writer role — credentials sourced from AGENT_DB_*.
            AGENT_DB_HOST: postgres
            AGENT_DB_PORT: '5432'
            AGENT_DB_USER: ${AGENT_DB_USER}
            AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
            AGENT_DB_NAME: ${AGENT_DB_NAME:-${DB_NAME}}
            AGENT_MCP_URL: ${AGENT_MCP_URL}
            AGENT_MCP_BEARER: ${AGENT_MCP_BEARER}
            AI_GATEWAY_URL: ${AI_GATEWAY_URL}
            AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
            AI_GATEWAY_MAX_USD_PER_RUN: ${AI_GATEWAY_MAX_USD_PER_RUN:-2.00}
            AGENT_WEEK_ISO: ${AGENT_WEEK_ISO:-}
            AGENT_REPORT_DIR: ${AGENT_REPORT_DIR:-/app/reports}
            AGENT_BOUNDARY_GUARD: ${AGENT_BOUNDARY_GUARD:-}
            GIT_SHA: ${GIT_SHA:-}
            NODE_ENV: ${NODE_ENV:-production}
            LOG_LEVEL: ${LOG_LEVEL:-info}
        depends_on:
            postgres:
                condition: service_healthy
            # Wait for bot-mcp /healthz before letting ofelia exec the loop —
            # the agent's MCP client otherwise races the server's first-bind.
            bot-mcp:
                condition: service_healthy
        volumes:
            # Weekly reports land here; host path is gitignored.
            - ./reports/agent:/app/reports:rw
        healthcheck:
            # Confirm the keep-alive PID1 is still running.
            test: ['CMD', 'pgrep', '-f', 'sleep']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
        labels:
            # Ofelia (bot-agent-cron) reads these labels to schedule the
            # weekly outer-loop. 6-field cron — first field is seconds.
            # Sun 00:00:00 UTC. no-overlap relies on the in-process lockfile
            # too (defense in depth) so two firings can never both run.
            ofelia.enabled: 'true'
            ofelia.job-exec.weekly-agent.schedule: '0 0 0 * * 0'
            ofelia.job-exec.weekly-agent.command: 'node dist/main.js'
            ofelia.job-exec.weekly-agent.tty: 'false'
            ofelia.job-exec.weekly-agent.no-overlap: 'true'

    # M13 W5.B — cron sidecar. Reads labels off bot-agent and triggers the
    # weekly outer-loop via `docker exec`. Sidecar pattern keeps system cron
    # out of the host while remaining trivial to inspect (`docker logs
    # trade-bot-agent-cron`). Docker socket is mounted read-only — ofelia
    # only needs to inspect labels + create exec sessions, never to manage
    # containers.
    bot-agent-cron:
        profiles: [agent]
        image: mcuadros/ofelia:latest
        container_name: trade-bot-agent-cron
        restart: unless-stopped
        command: daemon --docker
        depends_on:
            bot-agent:
                # bot-agent's healthcheck is `pgrep sleep`, but ofelia only
                # needs the container to exist when it tries to exec; service_started
                # is sufficient and avoids ordering deadlocks on first boot.
                condition: service_started
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro

    adminer:
        # R2 security M3 — adminer is a DB admin UI. Do not publish it on the
        # default stack. Opt-in via: `docker compose --profile dev up -d`.
        profiles: [dev]
        image: adminer:5.4.2
        container_name: trade-bot-adminer
        restart: unless-stopped
        ports:
            - '${ADMINER_PORT}:8080'
        environment:
            ADMINER_DEFAULT_SERVER: postgres
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres-data:
        name: trade-bot-postgres-data
